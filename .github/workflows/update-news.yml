name: Actualizar THE DAILY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update-news.yml'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: actualizar-the-daily
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis del recopilador
        run: python -m py_compile scripts/update_news.py
      - name: Recopilar noticias de todas las secciones
        run: python -u scripts/update_news.py
      - name: Guardar nueva edición
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar edición THE DAILY"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
