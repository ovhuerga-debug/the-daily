name: Actualizar THE DAILY
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Madrid'
    - cron: '0 21 * * *'
      timezone: 'Europe/Madrid'
permissions:
  contents: write
jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conservar edición anterior para reutilizar resúmenes
        run: |
          if [ -f editions/latest.json ]; then cp editions/latest.json editions/previous.json; fi
      - name: Instalar extractor de artículos
        run: python -m pip install trafilatura
      - name: Generar edición RSS
        env:
          EDITION_HOUR: ${{ github.event.schedule == '0 21 * * *' && '21' || '8' }}
        run: python scripts/update_news.py
      - name: Resumir y traducir noticias cuando exista clave API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_ENRICHED_PER_RUN: '60'
        run: python scripts/enrich_news.py
      - name: Publicar edición
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar edición THE DAILY"
            git push
          fi
