
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14283b">
<title>THE DAILY — Tu mundo en perspectiva</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box}
:root{font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#f7f5f1;color:#202020}
header{padding:25px 18px 15px;text-align:center;background:#fff;border-bottom:1px solid #ddd}
.brand{font-family:Georgia,serif;font-size:35px;letter-spacing:-2px;font-weight:bold}
.subtitle{font-size:10px;letter-spacing:3px;color:#777;margin-top:5px}
.edition{font-size:12px;color:#666;margin-top:14px}
nav{display:flex;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:2}
nav button{flex:1 1 auto;min-width:85px;border:0;background:transparent;padding:17px 9px;font-size:12px;font-weight:bold;color:#777;cursor:pointer}
nav button.active{color:var(--accent);border-bottom:3px solid var(--accent)}
main{max-width:850px;margin:auto;padding:20px 16px 60px}
.section{font-family:Georgia,serif;font-size:35px;margin:15px 0 5px}
.intro{color:#777;font-size:14px;margin-bottom:24px}
.tools{display:flex;gap:8px;margin-bottom:20px}
input,select{border:1px solid #ddd;border-radius:8px;padding:12px;background:white;min-width:0}
input{flex:1}
article{padding:22px 0;border-bottom:1px solid #ddd}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:bold}
h2{font-family:Georgia,serif;font-size:24px;line-height:1.2;margin:10px 0}
p{font-size:15px;line-height:1.65;color:#505050}
.meta{font-size:12px;color:#777}
.actions{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:15px;flex-wrap:wrap}
.actions a{color:var(--accent);font-size:13px;font-weight:bold;text-decoration:none}
.source-button{display:inline-block;background:var(--accent);color:#fff!important;border-radius:8px;padding:12px 16px;font-weight:bold;text-decoration:none;font-size:14px}
.translation{border-left:3px solid var(--accent);padding:10px 15px;margin:16px 0;background:rgba(130,130,130,.08);border-radius:0 8px 8px 0}
.translation-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:bold;color:var(--accent)}
.translation p{margin:8px 0 0}
.translate-button{border:1px solid var(--accent);background:transparent;color:inherit;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:bold}
.translate-fallback{display:inline-block;margin-top:8px;color:var(--accent);font-weight:bold}.source-meta{font-size:12px;margin:8px 0}.summary-note{font-size:12px;opacity:.75}
.save{border:1px solid #ccc;border-radius:20px;background:transparent;padding:8px 13px;cursor:pointer}
.notice{background:#fff8df;padding:14px;border-radius:9px;font-size:13px;line-height:1.5}
.empty{text-align:center;padding:35px;color:#777}
footer{text-align:center;padding:35px;color:#888;font-size:12px}
body.espana{--accent:#a83b31;background:#f7f3ed}
body.mundo{--accent:#8bbbe4;background:#14283b;color:#fff}
body.mundo header,body.mundo nav{background:#14283b;border-color:#395066}
body.mundo article{border-color:#395066}
body.mundo p,body.mundo .intro,body.mundo .meta{color:#c2ceda}
body.mundo input,body.mundo select{color:#202020}
body.mundo .notice{background:#243e55;color:#fff}
body.cultura{--accent:#873b92;background:#faf2fa}
body.viral{--accent:#ed6b46;background:#fff5ec}
body.tecnologia{--accent:#087f8c;background:#eef9fa}
body.estilo{--accent:#a16b46;background:#f6f0e8}
.subnav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.culture-filter-label{flex-basis:100%;font-size:11px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:8px 0 1px}.culture-filter-row{display:flex;flex-wrap:wrap;gap:7px;width:100%}
.subnav button{background:transparent;border:1px solid #aaa;border-radius:20px;padding:8px 13px;color:inherit;cursor:pointer}
.subnav button.selected{background:var(--accent);color:white;border-color:var(--accent)}
body.mundo .subnav button,body.television .subnav button{border-color:#8c98a6}
.video-link{display:inline-block;margin-top:8px;color:var(--accent);font-weight:bold;text-decoration:none}
body.television{--accent:#d2a54d;background:#24262c;color:#fff}
body.television header,body.television nav{background:#24262c;border-color:#494b50}
body.television article{border-color:#494b50}
body.television p,body.television .intro,body.television .meta{color:#ccc}
body.television .notice{background:#363941;color:#fff}
body.television input,body.television select{color:#202020}
@media(max-width:520px){header{padding:18px 12px 12px}.brand{font-size:32px}nav{position:static}nav button{flex:1 1 30%;min-width:0;padding:12px 5px;font-size:11px}.tools{flex-wrap:wrap}.tools input{flex-basis:100%;font-size:16px}.tools select{width:100%;font-size:16px}main{padding:14px 16px 90px}.section{font-size:30px}h2{font-size:23px}.source-button{min-height:44px}.subnav button{min-height:42px}}
@media(min-width:700px){.brand{font-size:52px}h2{font-size:30px}main{padding:35px}}

.culture-mode{display:flex;gap:9px;flex-wrap:wrap;width:100%;margin:10px 0 15px;padding:7px;background:#ede5ef;border-radius:15px}.culture-mode button{flex:1;min-width:150px;border:0!important;border-radius:11px!important;padding:14px 16px!important;font-size:14px;font-weight:700;background:transparent!important}.culture-mode button.selected{background:#873b92!important;color:#fff!important;box-shadow:0 3px 12px #873b9230}.culture-mode button:not(.selected){color:#583761!important}
/* THE DAILY · Editorial redesign */
:root{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-synthesis:none}
body{background:#f3f0e9;color:#1c2428}
header{padding:30px 20px 23px;background:#fdfbf7;border-bottom:1px solid #dedbd4}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(46px,8vw,94px);font-weight:900;letter-spacing:-.085em;line-height:.95}
.subtitle{font-size:11px;letter-spacing:.35em;font-weight:700;color:#846e59;margin-top:13px}
.edition{font-size:12px;letter-spacing:.03em;color:#777;margin-top:18px}
nav{justify-content:center;gap:4px;padding:9px 16px;background:#fdfbf7;box-shadow:0 3px 15px #1616160a}
nav button{flex:0 1 auto;min-width:auto;padding:12px 16px;border-radius:30px;font-size:12px;letter-spacing:.025em;transition:background .2s,color .2s}
nav button:hover{background:#e9e5dd}
nav button.active{background:var(--accent);color:white;border-bottom:0}
main{max-width:1180px;padding:32px 26px 85px}
.section{font-family:Georgia,serif;font-size:clamp(44px,6vw,74px);font-weight:700;letter-spacing:-.055em;line-height:1.05;margin:15px 0 8px}
.intro{max-width:660px;font-size:16px;line-height:1.6;margin-bottom:25px}
.tools{background:#ffffffb8;padding:12px;border:1px solid #e4dfd6;border-radius:15px;margin-bottom:20px}
input,select{border-color:#e3ded7}
#articles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
#articles article{background:#fffdf9;border:1px solid #e9e4dc;border-radius:18px;padding:26px;box-shadow:0 6px 24px #29231a0b;display:flex;flex-direction:column;min-width:0;transition:transform .18s,box-shadow .18s}
#articles article:hover{transform:translateY(-3px);box-shadow:0 12px 30px #29231a18}
#articles article:first-child{grid-column:1/-1;background:#fff;position:relative;padding:clamp(28px,5vw,54px);border-top:6px solid var(--accent)}
#articles article:first-child h2{font-size:clamp(32px,4vw,52px);max-width:850px;letter-spacing:-.035em}
#articles article:first-child p{max-width:830px;font-size:17px}
#articles h2{font-family:Georgia,serif;font-size:clamp(23px,2.6vw,32px);letter-spacing:-.025em;line-height:1.16}
#articles p{font-size:14px;line-height:1.65}
#articles .tag{font-size:11px;letter-spacing:.14em}
#articles .meta{font-size:12px;margin:8px 0}
#articles .actions{margin-top:auto;padding-top:20px}
#articles .source-button{font-size:12px;border-radius:30px;padding:11px 17px}
.subnav{gap:9px}
.subnav button{background:#fff8;border-color:#d9d2c9}
footer{border-top:1px solid #ddd4ca;background:#fdfbf7;font-size:12px;letter-spacing:.08em}
body.mundo #articles article,body.television #articles article{background:#2c3540;border-color:#47505a}
body.mundo #articles article:first-child,body.television #articles article:first-child{background:#303e4c}
body.mundo #articles p,body.television #articles p{color:#d1d7dc}
body.mundo .tools,body.television .tools{background:#ffffff10;border-color:#ffffff30}
body.mundo nav,body.television nav{box-shadow:none}
@media(max-width:700px){
 header{padding:24px 12px 19px}.brand{font-size:clamp(47px,11vw,75px)}
 nav{display:flex;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:9px 10px;gap:5px;scrollbar-width:none;position:sticky;top:0}
 nav::-webkit-scrollbar{display:none}
 nav button{flex:0 0 auto;min-width:auto;padding:11px 14px;font-size:12px}
 main{padding:22px 14px 65px}
 .section{font-size:49px}
 #articles{grid-template-columns:1fr;gap:12px}
 #articles article,#articles article:first-child{grid-column:1;padding:22px;border-radius:15px}
 #articles article:first-child{padding:27px 22px}
 #articles article:first-child h2{font-size:33px}
 #articles article:first-child p{font-size:15px}
 #articles h2{font-size:25px}
}


/* Photographic editorial magazine layout */
#articles{grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
#articles article{grid-column:span 6;overflow:hidden;padding:0;background:#fff;border-radius:5px;box-shadow:none}
#articles article:first-child{grid-column:span 12;padding:0;border-top:0}
#articles article .article-image{width:100%;aspect-ratio:16/10;overflow:hidden;background:#e8e4dd}
#articles article:first-child .article-image{aspect-ratio:21/9}
#articles article .article-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
#articles article:hover .article-image img{transform:scale(1.035)}
#articles article>.tag,#articles article>h2,#articles article>.meta,#articles article>p,#articles article>.translation,#articles article>.summary-note,#articles article>.video-link,#articles article>.actions{margin-left:25px;margin-right:25px}
#articles article>.tag{margin-top:24px}
#articles article>.actions{margin-bottom:25px}
#articles article:first-child>.tag,#articles article:first-child>h2,#articles article:first-child>.meta,#articles article:first-child>p,#articles article:first-child>.translation,#articles article:first-child>.actions{margin-left:clamp(25px,5vw,55px);margin-right:clamp(25px,5vw,55px)}
#articles article:first-child>.tag{margin-top:30px}
#articles article:first-child>.actions{margin-bottom:30px}
#articles article.text-only{border-top:4px solid var(--accent)}
#articles article.text-only:first-child{border-top:6px solid var(--accent)}
#articles article .tag{font-weight:900;letter-spacing:.16em}
#articles article h2{line-height:1.12}
@media(max-width:700px){
 #articles{display:block}
 #articles article,#articles article:first-child{margin-bottom:17px;padding:0;border-radius:5px}
 #articles article:first-child .article-image{aspect-ratio:4/3}
 #articles article .article-image{aspect-ratio:16/10}
 #articles article>.tag,#articles article>h2,#articles article>.meta,#articles article>p,#articles article>.translation,#articles article>.actions,#articles article:first-child>.tag,#articles article:first-child>h2,#articles article:first-child>.meta,#articles article:first-child>p,#articles article:first-child>.translation,#articles article:first-child>.actions{margin-left:20px;margin-right:20px}
 #articles article>.actions,#articles article:first-child>.actions{margin-bottom:22px}
}

</style>
</head>
<body class="espana">
<header>
<div class="brand">THE DAILY</div>
<div class="subtitle">TU MUNDO EN PERSPECTIVA</div>
<div class="edition" id="edition">Edición de demostración</div>
</header>
<nav id="tabs"></nav>
<main>
<h1 class="section" id="section"></h1>
<div class="intro" id="intro"></div>
<div id="categories" class="subnav"></div>
<div id="languages" class="subnav"></div>
<div class="tools">
<input id="search" placeholder="Buscar noticias...">
<select id="filter">
<option value="all">Todas</option>
<option value="saved">Guardadas</option>
</select>
</div>
<div id="notice" class="notice">
Esta es una versión de demostración. Las noticias de ejemplo
no son titulares actuales. Las ediciones reales se mostrarán
cuando conectemos las fuentes y el sistema de publicación.
</div>
<div id="articles"></div>
</main>
<footer>THE DAILY · Información con contexto y fuentes</footer>
<script>
const sections=[
{id:"espana",name:"España",target:20,desc:"Las noticias esenciales de España."},
{id:"mundo",name:"Mundo",target:30,desc:"La actualidad internacional desde múltiples perspectivas."},
{id:"cultura",name:"Cultura",target:40,desc:"Arte, libros, cine, música y artes escénicas."},
{id:"television",name:"Televisión",target:null,desc:"Audiencias, estrenos y formatos internacionales."},
{id:"tecnologia",name:"Tecnología",target:null,desc:"Innovación, dispositivos, inteligencia artificial y ciencia aplicada."},
{id:"estilo",name:"Estilo",target:null,desc:"Moda masculina, tendencias, grooming, relojes y estilo de vida en español e inglés."},
{id:"viral",name:"Lo más viral",target:null,desc:"Vídeos y noticias que circulan por internet, con fuentes en español e inglés."}
];

const demo=[
{section:"espana",category:"Política y sociedad",title:"Cómo se construye una noticia contrastada",summary:"THE DAILY comparará la cobertura de distintos medios para separar los hechos confirmados de las interpretaciones. Las noticias importantes podrán reunir varias fuentes y explicar sus diferencias.",sources:[{name:"Agencia EFE",url:"https://efe.com/"},{name:"RTVE Noticias",url:"https://www.rtve.es/noticias/"}]},
{section:"espana",category:"Economía",title:"Una mirada a la economía española",summary:"La sección de economía reunirá indicadores, decisiones empresariales y noticias que afecten a los ciudadanos, con contexto y enlaces a los medios originales.",sources:[{name:"Cinco Días",url:"https://cincodias.elpais.com/"}]},
{section:"mundo",category:"Geopolítica",title:"El mundo contado desde distintas regiones",summary:"La cobertura internacional combinará medios de América, Europa, Asia y Oceanía. Evitaremos que la selección dependa exclusivamente de las portadas de Estados Unidos y Reino Unido.",sources:[{name:"Reuters",url:"https://www.reuters.com/"},{name:"BBC",url:"https://www.bbc.com/news"}]},
{section:"mundo",category:"Asia y Oceanía",title:"Una ventana informativa hacia el Pacífico",summary:"La futura edición incorporará información de Japón, China, Corea, India, Australia y otros países relevantes de la región.",sources:[{name:"NHK",url:"https://www3.nhk.or.jp/nhkworld/"},{name:"ABC Australia",url:"https://www.abc.net.au/news"}]},
{section:"cultura",category:"Exposiciones",title:"Una agenda internacional de arte y museos",summary:"Este espacio recogerá inauguraciones, exposiciones, bienales y grandes acontecimientos culturales, con especial atención a las fechas y ciudades donde pueden visitarse.",sources:[{name:"The Art Newspaper",url:"https://www.theartnewspaper.com/"}]},
{section:"cultura",category:"Cine y teatro",title:"Estrenos, festivales y artes escénicas",summary:"Las noticias culturales reunirán cine, teatro, musicales, libros y música. Cada noticia explicará su relevancia y facilitará la consulta de la fuente original.",sources:[{name:"Variety",url:"https://variety.com/"},{name:"The Stage",url:"https://www.thestage.co.uk/"}]},
{section:"television",category:"Audiencias",title:"El pulso de la televisión internacional",summary:"El radar de audiencias permitirá conocer resultados de programas y cadenas, distinguiendo entre espectadores, cuota de pantalla y consumo digital cuando existan datos comparables.",sources:[{name:"BARLOVENTO",url:"https://barloventocomunicacion.es/"}]},
{section:"television",category:"Formatos",title:"Los nuevos formatos que viajan por el mundo",summary:"La sección seguirá lanzamientos de concursos, realities y dating shows, sus mecánicas, adaptaciones internacionales y tendencias de producción.",sources:[{name:"C21Media",url:"https://www.c21media.net/"},{name:"Realscreen",url:"https://realscreen.com/"}]}
];

let active="espana";
let categoryFilter="all";let regionFilter="all";let cultureMode="noticias";
let languageFilter="all";
let stories=demo;
let translationCache={};
try{translationCache=JSON.parse(localStorage.getItem("dailyTranslations")||"{}")}catch(e){translationCache={}}
let live=false;
let editionName="Demostración";
let saved=[];
try{saved=JSON.parse(localStorage.getItem("dailySaved")||"[]")}catch(e){saved=[]}
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const storyId=n=>n.id||n.section+"|"+n.title;
function validUrl(u){
try{let x=new URL(u);return ["https:","http:"].includes(x.protocol)?x.href:null}catch(e){return null}
}
function render(){
const categorized=active==="cultura";
const bilingual=true;
const regionChoices=[["all","🌍 Todas las zonas"],["Madrid","📍 Madrid"],["España","🇪🇸 España"],["Internacional","🌐 Internacional"]];
const categories=["all","Música","Cine","Teatro","Cultura general"];
$("categories").style.display=categorized?"flex":"none";
$("categories").innerHTML=categorized?`<div class="culture-mode"><button data-culture-mode="noticias" class="${cultureMode==="noticias"?"selected":""}">Actualidad cultural</button><button data-culture-mode="agenda" class="${cultureMode==="agenda"?"selected":""}">Agenda · Qué hacer</button></div><div class="culture-filter-label">Temas</div><div class="culture-filter-row">${categories.map(c=>`<button data-category="${c}" class="${categoryFilter===c?"selected":""}">${c==="all"?"Todas":c}</button>`).join("")}</div><div class="culture-filter-label">Ubicación · primero Madrid, después España</div><div class="culture-filter-row">${regionChoices.map(([id,name])=>`<button data-region="${id}" class="${regionFilter===id?"selected":""}">${name}</button>`).join("")}</div>`:"";
$("languages").style.display=bilingual?"flex":"none";
$("languages").innerHTML=bilingual?[["all","Ambos idiomas"],["es","En español"],["en","In English"]].map(([id,name])=>`<button data-lang="${id}" class="${languageFilter===id?"selected":""}">${name}</button>`).join(""):"";
let s=sections.find(x=>x.id===active);
document.body.className=active;
$("tabs").innerHTML=sections.map(x=>`<button class="${x.id===active?"active":""}" data-tab="${x.id}">${x.name}</button>`).join("");
$("section").textContent=s.name;
$("intro").textContent=s.desc+(s.target?" Objetivo editorial: "+s.target+" noticias.":"");
$("edition").textContent=editionName;
$("notice").style.display=live?"none":"block";
let q=$("search").value.toLocaleLowerCase("es");
let items=stories.filter(n=>n.section===active)
.filter(n=>(n.title+" "+n.summary+" "+(n.translationEs||"")+" "+n.category).toLocaleLowerCase("es").includes(q))
.filter(n=>!categorized||(n.cultureView||"noticias")===cultureMode)
.filter(n=>!categorized||categoryFilter==="all"||n.topic===categoryFilter)
.filter(n=>!categorized||regionFilter==="all"||(n.region||"Internacional")===regionFilter)
.filter(n=>!bilingual||languageFilter==="all"||(n.language||"es")===languageFilter)
.filter(n=>$("filter").value!=="saved"||saved.includes(storyId(n)));
if(categorized)items.sort((a,b)=>({Madrid:0,"España":1,Internacional:2}[a.region||"Internacional"]??2)-({Madrid:0,"España":1,Internacional:2}[b.region||"Internacional"]??2)||(b.publishedAt||"").localeCompare(a.publishedAt||""));
if(items.length)items=[...items].sort((a,b)=>Number(Boolean(b.image))-Number(Boolean(a.image)));
$("articles").innerHTML=items.length?items.map(n=>{
let id=storyId(n);
if(translationCache[id]&&!n.translationEs)n.translationEs=translationCache[id];
let links=(n.sources||[]).map(x=>{
let url=validUrl(x.url);
return url?`<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(x.name||"Fuente")}</a>`:"";
}).filter(Boolean).join(" · ");
return `<article class="${n.image&&validUrl(n.image)?"with-image":"text-only"}">
${n.image&&validUrl(n.image)?`<div class="article-image"><img src="${escapeHTML(validUrl(n.image))}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`:""}
<div class="tag">${escapeHTML(n.topic||n.category||"Actualidad")} ${n.language==="en"?" · EN":n.language==="es"?" · ES":""}</div>
<h2>${escapeHTML(n.title)}</h2>
<div class="meta">${escapeHTML(n.region||"")} ${n.publishedAt?" · "+escapeHTML(n.publishedAt):""}</div>
<p>${escapeHTML(n.summary)}</p>
${n.language==="en"?`<div class="translation"><div class="translation-label">Traducción al español</div><p>${n.translationEs?escapeHTML(n.translationEs):`<button class="translate-button" data-translate="${escapeHTML(id)}">Traducir gratis al español</button><div class="translation-result" data-result="${escapeHTML(id)}"></div>`}</p></div>`:""}
${n.summaryStatus==="excerpt"?'<div class="summary-note">Extracto disponible: faltan datos para elaborar un resumen más extenso.</div>':""}
${n.section==="viral"&&n.videoUrl&&validUrl(n.videoUrl)?`<a class="video-link" target="_blank" rel="noopener noreferrer" href="${escapeHTML(validUrl(n.videoUrl))}">▶ Ver vídeo original</a>`:""}
<div class="actions">
<div class="source-area">${(n.sources||[]).length&&validUrl(n.sources[0].url)?`<a class="source-button" href="${escapeHTML(validUrl(n.sources[0].url))}" target="_blank" rel="noopener noreferrer">↗ Leer noticia original</a>`:""}<div class="source-meta">Fuente: ${links||"Pendiente"}</div></div>
<button class="save" data-save="${escapeHTML(id)}">${saved.includes(id)?"★ Guardada":"☆ Guardar"}</button>
</div></article>`;
}).join(""):`<div class="empty">No hay noticias para esta selección.</div>`;
}
$("tabs").addEventListener("click",e=>{
let b=e.target.closest("[data-tab]");
if(b){active=b.dataset.tab;categoryFilter="all";regionFilter="all";cultureMode="noticias";languageFilter="all";$("search").value="";render()}
});
$("categories").addEventListener("click",e=>{let b=e.target.closest("[data-category]");if(b){categoryFilter=b.dataset.category;render()}});
$("categories").addEventListener("click",e=>{let mode=e.target.closest("[data-culture-mode]");if(mode){cultureMode=mode.dataset.cultureMode;render()}});
$("categories").addEventListener("click",e=>{let b=e.target.closest("[data-region]");if(b){regionFilter=b.dataset.region;render()}});
$("languages").addEventListener("click",e=>{let b=e.target.closest("[data-lang]");if(b){languageFilter=b.dataset.lang;render()}});
$("articles").addEventListener("click",async e=>{
let translate=e.target.closest("[data-translate]");
if(translate){
 const id=translate.dataset.translate;
 const n=stories.find(x=>storyId(x)===id);
 if(!n)return;
 translate.disabled=true;
 translate.textContent="Traduciendo…";
 const result=$("articles").querySelector('[data-result="'+CSS.escape(id)+'"]');
 const original=(n.title+". "+n.summary).slice(0,450);
 const fallback="https://translate.google.com/?sl=en&tl=es&text="+encodeURIComponent(original)+"&op=translate";
 try{
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(original)+"&langpair=en%7Ces";
  const response=await fetch(url);
  if(!response.ok)throw Error("No disponible");
  const data=await response.json();
  const translated=data.responseData&&data.responseData.translatedText;
  if(!translated||data.responseStatus!==200||/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(translated))throw Error("Sin traducción");
  n.translationEs=translated;
  translationCache[id]=translated;
  try{localStorage.setItem("dailyTranslations",JSON.stringify(translationCache))}catch(e){}
  render();
 }catch(err){
  translate.textContent="No disponible ahora";
  translate.disabled=false;
  if(result)result.innerHTML='<a class="translate-fallback" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(fallback)+'">Abrir traducción gratuita ↗</a>';
 }
 return;
}
let b=e.target.closest("[data-save]");
if(!b)return;
let id=b.dataset.save;
saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
localStorage.setItem("dailySaved",JSON.stringify(saved));
render();
});
$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);
async function loadEdition(){
try{
// Prefer the freshest valid edition: GitHub Pages can lag behind the repository.
const urls=[
 "./editions/latest.json?ts="+Date.now(),
 "https://raw.githubusercontent.com/ovhuerga-debug/the-daily/main/editions/latest.json?ts="+Date.now()
];
const editions=await Promise.all(urls.map(async url=>{
 try{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();return Array.isArray(data.stories)?data:null}catch(e){return null}
}));
const valid=editions.filter(Boolean);
if(!valid.length)throw Error("No edition");
valid.sort((a,b)=>(Date.parse(b.generatedAt)||0)-(Date.parse(a.generatedAt)||0));
const data=valid[0];
stories=data.stories.filter(n=>sections.some(s=>s.id===n.section)&&n.title&&n.summary);
editionName=(data.edition||"Última edición")+" · "+stories.filter(n=>n.section==="estilo").length+" noticias de Estilo";
live=true;
}catch(e){live=false}
render();
}
loadEdition();
</script>
