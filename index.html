/* Photographic editorial magazine layout */
#articles{grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}

<script>
const sections=[
{id:"espana",name:"España",target:20,desc:"Las noticias esenciales de España."},
{id:"mundo",name:"Mundo",target:30,desc:"La actualidad internacional desde múltiples perspectivas."},

{id:"television",name:"Televisión",target:null,desc:"Audiencias, estrenos y formatos internacionales."},
{id:"tecnologia",name:"Tecnología",target:null,desc:"Innovación, dispositivos, inteligencia artificial y ciencia aplicada."},
{id:"estilo",name:"Estilo",target:null,desc:"Moda masculina, tendencias, grooming, relojes y estilo de vida en español e inglés."},

{id:"viral",name:"Lo más viral",target:null,desc:"Vídeos y noticias que circulan por internet, con fuentes en español e inglés."}
];

const demo=[
{section:"espana",category:"Política y sociedad",title:"Cómo se construye una noticia contrastada",summary:"THE DAILY comparará la cobertura de distintos medios para separar los hechos confirmados de las interpretaciones. Las noticias importantes podrán reunir varias fuentes y explicar sus diferencias.",sources:[{name:"Agencia EFE",url:"https://efe.com/"},{name:"RTVE Noticias",url:"https://www.rtve.es/noticias/"}]},
{section:"espana",category:"Economía",title:"Una mirada a la economía española",summary:"La sección de economía reunirá indicadores, decisiones empresariales y noticias que afecten a los ciudadanos, con contexto y enlaces a los medios originales.",sources:[{name:"Cinco Días",url:"https://cincodias.elpais.com/"}]},
{section:"mundo",category:"Geopolítica",title:"El mundo contado desde distintas regiones",summary:"La cobertura internacional combinará medios de América, Europa, Asia y Oceanía. Evitaremos que la selección dependa exclusivamente de las portadas de Estados Unidos y Reino Unido.",sources:[{name:"Reuters",url:"https://www.reuters.com/"},{name:"BBC",url:"https://www.bbc.com/news"}]},
{section:"mundo",category:"Asia y Oceanía",title:"Una ventana informativa hacia el Pacífico",summary:"La futura edición incorporará información de Japón, China, Corea, India, Australia y otros países relevantes de la región.",sources:[{name:"NHK",url:"https://www3.nhk.or.jp/nhkworld/"},{name:"ABC Australia",url:"https://www.abc.net.au/news"}]},
{section:"cultura",category:"Exposiciones",title:"Una agenda internacional de arte y museos",summary:"Este espacio recogerá inauguraciones, exposiciones, bienales y grandes acontecimientos culturales, con especial atención a las fechas y ciudades donde pueden visitarse.",sources:[{name:"The Art Newspaper",url:"https://www.theartnewspaper.com/"}]},
{section:"cultura",category:"Cine y teatro",title:"Estrenos, festivales y artes escénicas",summary:"Las noticias culturales reunirán cine, teatro, musicales, libros y música. Cada noticia explicará su relevancia y facilitará la consulta de la fuente original.",sources:[{name:"Variety",url:"https://variety.com/"},{name:"The Stage",url:"https://www.thestage.co.uk/"}]},
{section:"television",category:"Audiencias",title:"El pulso de la televisión internacional",summary:"El radar de audiencias permitirá conocer resultados de programas y cadenas, distinguiendo entre espectadores, cuota de pantalla y consumo digital cuando existan datos comparables.",sources:[{name:"BARLOVENTO",url:"https://barloventocomunicacion.es/"}]},
{section:"television",category:"Formatos",title:"Los nuevos formatos que viajan por el mundo",summary:"La sección seguirá lanzamientos de concursos, realities y dating shows, sus mecánicas, adaptaciones internacionales y tendencias de producción.",sources:[{name:"C21Media",url:"https://www.c21media.net/"},{name:"Realscreen",url:"https://realscreen.com/"}]}
];

const tabs=[{id:"portada",name:"Portada"},{id:"mi-edicion",name:"Mi edición"},...sections];
const requestedSection=new URLSearchParams(location.search).get("section");
let active=tabs.some(tab=>tab.id===requestedSection)?requestedSection:"portada";
let popHorizon="all";
let breakingBySection={};
let categoryFilter="all";let regionFilter="all";let cultureMode="noticias";
let languageFilter="all";
let stories=demo;
let translationCache={};
try{translationCache=JSON.parse(localStorage.getItem("dailyTranslations")||"{}")}catch(e){translationCache={}}
let live=false;
let editionName="Demostración";
let saved=[];
try{saved=JSON.parse(localStorage.getItem("dailySaved")||"[]")}catch(e){saved=[]}
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const storyId=n=>n.id||n.section+"|"+n.title;
function validUrl(u){
try{let x=new URL(u);return ["https:","http:"].includes(x.protocol)?x.href:null}catch(e){return null}
}
const newStoryIds=new Set();

function markNewStories(){
 const ids=stories.map(storyId);
 try{
  const raw=localStorage.getItem("dailyLastVisitStories");
  if(raw){
   const previous=new Set(JSON.parse(raw));
   for(const id of ids)if(!previous.has(id))newStoryIds.add(id);
  }
  localStorage.setItem("dailyLastVisitStories",JSON.stringify(ids));
 }catch(error){}
}

function editorialTitle(story){
 const title=story.title.replace(/ - [^-]+$/,suffix=>(story.sources||[]).some(source=>
  source.name?.toLocaleLowerCase("es")===suffix.slice(3).trim().toLocaleLowerCase("es"))?"":suffix);
 return title.normalize("NFD").replace(/\p{Diacritic}/gu,"").toLocaleLowerCase("es").replace(/[^\p{L}\p{N}]+/gu," ").trim();
}

function geographicPriority(story){
 const area=story.region||story.coverageArea||story.viralMarket||"";
 const title=editorialTitle(story);
 if(area==="Madrid"||/\b(madrid|madrilen[oa]s?|alcorcon)\b/.test(title))return 0;
 if(area==="España"||story.section==="espana"||/\b(espana|spain|espanol[ae]s?|spanish)\b/.test(title))return 1;
 if(area==="Europa"||/\b(europa|europe|union europea|european union|francia|france|alemania|germany|italia|italy|portugal|reino unido|uk|belgica|belgium|ucrania|ukraine|polonia|poland|bruselas|brussels)\b/.test(title))return 2;
 return 3;
}
function geographicOrder(a,b){return geographicPriority(a)-geographicPriority(b);}

function sectionPriority(story,today){
 const title=editorialTitle(story);
 if(story.section==="television"){
  return Number(/\b(audiencias?|estren\w*|formatos?|renewed|ratings?|premier\w*|adaptacion)\b/.test(title));
 }
 if(story.section==="eventos"){
  const days=story.eventDate?(Date.parse(story.eventDate)-Date.parse(today))/86400000:Infinity;
  if(days>=0&&days<=7)return 3;
  if(story.popHorizon==="entradas"&&!/\bagotad\w*\b/.test(title))return 2;
  if(story.popHorizon==="ahora")return 1;
 }
 return 0;
}

function uniqueHeadlines(items,limit=3){
 const selected=[];
 const titles=new Set();
 for(const story of items){
  const title=editorialTitle(story);
  if(!title||titles.has(title))continue;
  titles.add(title);
  selected.push(story);
  if(selected.length===limit)break;
 }
 return selected;
}

function storyPhoto(story){
 const url=validUrl(story.image);
 return url?.startsWith("https://media.revistagq.com/photos/")?url.replace("/master/pass/","/w_640/"):url;
}
function storyThumbnail(story){
 const image=storyPhoto(story);
 return image?`<img class="front-thumb" src="${escapeHTML(image)}" alt="" width="76" height="53" loading="lazy" referrerpolicy="no-referrer">`:"";
}
function renderFrontStory(story){
 const sources=(story.sources||[]).filter(item=>validUrl(item.url));
 const source=sources[0];
 const title=escapeHTML(story.title);
 const alternatives=sources.slice(1).map(item=>`<a href="${escapeHTML(validUrl(item.url))}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.name)}</a>`).join(" · ");
 return `<li class="front-story"><div>
  <h3>${source?`<a href="${escapeHTML(validUrl(source.url))}" target="_blank" rel="noopener noreferrer">${title}</a>`:title}</h3>
  <small>${escapeHTML(source?.name||"")}${alternatives?` · ${alternatives}`:""}${newStoryIds.has(storyId(story))?'<span class="front-new">Nuevo</span>':""}</small>
 </div>${storyThumbnail(story)}</li>`;
}

function renderFront(){
 const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Madrid"}).format(new Date());
 const shortlists=sections.map(section=>{
  const candidates=stories.filter(story=>story.section===section.id);
  candidates.sort((a,b)=>geographicOrder(a,b)||sectionPriority(b,today)-sectionPriority(a,today));
  return uniqueHeadlines(candidates);
 });
 const candidates=sections.map((section,index)=>shortlists[index][0])
  .filter(story=>story&&["espana","mundo","cultura","television","tecnologia"].includes(story.section))
  .sort((a,b)=>{
   const importance=story=>Math.min(2,(story.sources?.length||1)-1)*3+
    2*Number(/\b(elecciones|gobierno|sentencia|alerta|incendio|inundacion|empleo|presupuestos|war|election|court)\b/.test(editorialTitle(story)));
   return spainFirst(a,b)||geographicOrder(a,b)||importance(b)-importance(a)||(b.publishedAt||"").localeCompare(a.publishedAt||"");
  });
 const essential=live?uniqueHeadlines(candidates):[];
 const lead=essential.length?`<section class="front-section front-essential" aria-labelledby="front-essential">
  <div class="front-heading"><h2 id="front-essential">Imprescindibles</h2></div>
  <ul class="front-list">${essential.map(renderFrontStory).join("")}</ul>
 </section>`:"";
 $("front").innerHTML=lead+sections.map((section,index)=>{
  const headlines=shortlists[index];
  return `<section class="front-section" data-desk="${section.id}" aria-labelledby="front-${section.id}">
   <div class="front-heading">
    <h2 id="front-${section.id}">${section.name}</h2>
    <button type="button" data-tab="${section.id}" aria-label="Ver sección completa: ${section.name}">Ver sección completa →</button>
   </div>
   ${headlines.length?`<ul class="front-list">${headlines.map(renderFrontStory).join("")}</ul>`:'<p class="front-empty">Sin titulares en esta edición.</p>'}
  </section>`;
 }).join("");
}

function keepTabVisible(){
 const nav=$("tabs");
 const current=nav.querySelector('[aria-current="page"]');
 const navBox=nav.getBoundingClientRect();
 const tabBox=current.getBoundingClientRect();
 if(tabBox.left<navBox.left || tabBox.right>navBox.right){
  nav.scrollLeft+=tabBox.left-navBox.left-(navBox.width-tabBox.width)/2;
 }
}

const personalTopics=[
 ["espana","España","espana",null],
 ["formatos","Formatos y realities","television",/\b(formato|formatos|format|formats|reality|unscripted|game show|dating show|concurso)\b/i],
 ["audiencias","Audiencias","television",/\b(audiencia|audiencias|ratings|viewership|cuota de pantalla|espectadores)\b/i],
 ["musica","Música en directo","",/\b(conciertos?|festivales?|festival|giras?|tour)\b/i],

function weekendRange(now=new Date()){
 const madridDay=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Madrid"}).format(now);
 const friday=new Date(madridDay+"T12:00:00Z");
 const weekday=friday.getUTCDay();
 friday.setUTCDate(friday.getUTCDate()+(weekday===0?-2:5-weekday));
 const sunday=new Date(friday);
 sunday.setUTCDate(sunday.getUTCDate()+2);
 return [friday.toISOString().slice(0,10),sunday.toISOString().slice(0,10)];
}

function matchingTopics(story){
 const text=editorialTitle(story)+" "+(story.topic||"");
 return personalTopics.filter(([, ,section,pattern])=>
  (!section||story.section===section)&&(!pattern||pattern.test(text)));
}

 </div><div class="personal-story-actions">${storyThumbnail(story)}<button class="personal-pill" type="button" data-personal-save="${escapeHTML(id)}" aria-label="${isSaved?"Quitar de guardados":"Guardar"}: ${title}" aria-pressed="${isSaved}">${isSaved?"★":"☆"}</button></div></li>`;

 else renderPersonal();
 const attribute=follow?"data-follow":radar?"data-radar":"data-personal-save";
 panel.querySelector(`[${attribute}="${CSS.escape(follow||radar||personalSave)}"]`)?.focus({preventScroll:true});
}
$("personal").addEventListener("click",handlePersonalControls);
$("tv-radar").addEventListener("click",handlePersonalControls);
document.addEventListener("error",event=>{
 const target=event.target;
 if(!(target instanceof HTMLImageElement))return;
 if(target.matches(".front-thumb"))target.remove();
 else if(target.closest(".article-image"))target.closest(".article-image").remove();
},true);
$("categories").addEventListener("click",e=>{let b=e.target.closest("[data-category]");if(b){categoryFilter=b.dataset.category;render()}});
$("categories").addEventListener("click",e=>{let b=e.target.closest("[data-pop-horizon]");if(b){popHorizon=b.dataset.popHorizon;render()}});
$("categories").addEventListener("click",e=>{let mode=e.target.closest("[data-culture-mode]");if(mode){cultureMode=mode.dataset.cultureMode;render()}});
$("categories").addEventListener("click",e=>{let b=e.target.closest("[data-region]");if(b){regionFilter=b.dataset.region;render()}});
$("languages").addEventListener("click",e=>{let b=e.target.closest("[data-lang]");if(b){languageFilter=b.dataset.lang;render()}});
$("articles").addEventListener("click",async e=>{
const citySave=e.target.closest(".city-agenda [data-personal-save]");
if(citySave){
 const id=citySave.dataset.personalSave;
 saved=saved.includes(id)?saved.filter(item=>item!==id):[...saved,id];
 try{localStorage.setItem("dailySaved",JSON.stringify(saved))}catch{}
 render();
 $("articles").querySelector(`.city-agenda [data-personal-save="${CSS.escape(id)}"]`)?.focus({preventScroll:true});
 return;
}
const night=e.target.closest(".nightlife [data-category]");
if(night){
 categoryFilter="Bares y noche";
 popHorizon="all";
 render();
 $("articles").querySelector(".nightlife button")?.focus({preventScroll:true});
 return;
}
let translate=e.target.closest("[data-translate]");
if(translate){
 const id=translate.dataset.translate;
 const n=stories.find(x=>storyId(x)===id);
 if(!n)return;
 translate.disabled=true;
 translate.textContent="Traduciendo…";
 const result=$("articles").querySelector('[data-result="'+CSS.escape(id)+'"]');
 const original=(n.title+". "+n.summary).slice(0,450);
 const fallback="https://translate.google.com/?sl=en&tl=es&text="+encodeURIComponent(original)+"&op=translate";
 try{
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(original)+"&langpair=en%7Ces";
  const response=await fetch(url);
  if(!response.ok)throw Error("No disponible");
  const data=await response.json();
  const translated=data.responseData&&data.responseData.translatedText;
  if(!translated||data.responseStatus!==200||/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(translated))throw Error("Sin traducción");
  n.translationEs=translated;
  translationCache[id]=translated;
  try{localStorage.setItem("dailyTranslations",JSON.stringify(translationCache))}catch(e){}
  render();
 }catch(err){
  translate.textContent="No disponible ahora";
  translate.disabled=false;
  if(result)result.innerHTML='<a class="translate-fallback" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(fallback)+'">Abrir traducción gratuita ↗</a>';
 }
 return;
}
let b=e.target.closest("[data-save]");
if(!b)return;
let id=b.dataset.save;
saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
localStorage.setItem("dailySaved",JSON.stringify(saved));
render();
});
$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);
async function loadEdition(){
try{
// Prefer the freshest valid edition: GitHub Pages can lag behind the repository.
const urls=[
 "./editions/latest.json?ts="+Date.now(),
 "https://raw.githubusercontent.com/ovhuerga-debug/the-daily/refs/heads/main/editions/latest.json?ts="+Date.now()
];
const editions=await Promise.all(urls.map(async url=>{
 try{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();return Array.isArray(data.stories)?data:null}catch(e){return null}
}));
const valid=editions.filter(Boolean);
if(!valid.length)throw Error("No edition");
valid.sort((a,b)=>(Date.parse(b.generatedAt)||0)-(Date.parse(a.generatedAt)||0));
const data=valid[0];
breakingBySection=data.breaking||{};
stories=data.stories.filter(n=>sections.some(s=>s.id===n.section)&&n.title&&n.summary);
editionName=(data.edition||"Última edición")+" · "+stories.filter(n=>n.section==="estilo").length+" noticias de Estilo";
live=true;
markNewStories();
}catch(e){live=false}
render();
}
render();
keepTabVisible();
loadEdition();
</script>
